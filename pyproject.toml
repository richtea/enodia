[project]
name = "enodia"
version = "0.2.0"
description = "OAuth resource-server gateway for MCP servers that only support a static bearer token"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastmcp==4.1.8",
    "joserfc==1.8.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
enodia = "enodia:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.6",
    "ty==0.0.110",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# Infer return types of unannotated functions instead of treating them as Unknown (off by default).
return-type-inference = "always"
