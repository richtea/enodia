name: Build and test

# Reusable: lint, type-check and test, then build the image for amd64 and smoke-test it. Pushes nothing.
# Called by ci.yml (every push and pull request) and release-published.yml (the exact commit being released).

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to check out (default: the triggering commit)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.10"
      - name: Install dependencies (hash-pinned)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run --locked ruff check --output-format=github .
      - name: Type check (ty)
        run: uv run --locked ty check --output-format=github
      - name: Run tests
        run: uv run --locked pytest -q

  smoke:
    name: Smoke test image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: enodia:ci
      - name: Smoke test
        run: |
          set -u
          # Runs as UID 1000.
          test "$(docker run --rm --entrypoint id enodia:ci -u)" = "1000"
          # Refuses to start without a configuration file.
          if out=$(docker run --rm enodia:ci 2>&1); then
            echo "gateway started without configuration"; exit 1
          fi
          echo "$out" | grep -q "cannot read config file /etc/enodia/config.toml"
