name: Release published

# Publishing a release (normally the draft made by release-pr-merged.yml) builds the tagged commit, tests it, and,
# once the `release` environment is approved, pushes the multi-arch image to ghcr.io with build provenance.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag and release files
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != v* ]]; then echo "::error::tag '$TAG' does not start with v"; exit 1; fi
          version="${TAG#v}"
          python3 -I scripts/release.py pep440 "$version" > /dev/null  # a valid release version
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $TAG ($commit) is not on main"; exit 1
          fi
          python3 -I scripts/release.py verify "$version"
          prerelease=$(python3 -I scripts/release.py is-prerelease "$version")
          if [[ "$prerelease" != "$RELEASE_PRERELEASE" ]]; then
            echo "::error::the release's prerelease flag ($RELEASE_PRERELEASE) does not match version $version"; exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    needs: verify
    uses: ./.github/workflows/build-test.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}
    permissions:
      contents: read

  publish:
    name: Publish image
    needs: [verify, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # sign the provenance attestation (OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # X.Y and latest are only added for stable releases; prereleases get just their full version.
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
