name: CI

# Publishing is not done here: images are published only by release-published.yml, after a release is published
# and the `release` environment is approved. See docs/releasing.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    uses: ./.github/workflows/build-test.yml
    permissions:
      contents: read

  # Release pull requests (branch chore/release-<version>, opened by scripts/release.py): the branch name,
  # pyproject.toml, uv.lock and CHANGELOG.md must agree, and the version must be newer than every existing release.
  release-pr:
    name: Release PR check
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'chore/release-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Check the release version
        env:
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -I scripts/release.py parse-branch "$HEAD_REF")
          python3 -I scripts/release.py verify "$version"
          { git tag --list 'v*'; gh api "repos/$REPO/releases" --paginate --jq '.[].tag_name'; } > "$RUNNER_TEMP/existing.txt"
          python3 -I scripts/release.py check-newer "$version" --existing "$RUNNER_TEMP/existing.txt"
          echo "Release pull request for $version is consistent" >> "$GITHUB_STEP_SUMMARY"
